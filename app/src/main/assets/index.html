    function renderPage(page){const el=$('content');const renderers={home:homePage,editor:editorPage,github:githubPage,tools:toolsPage,shell:shellPage,ai:aiPage,browser:browserPage,vpn:vpnPage,files:filesPage,settings:settingsPage,developer:developerPage};el.innerHTML=(renderers[page]||homePage)();bindPage(page);if(page==='github')loadFeaturedRepos();if(page==='editor')updateEditorStatus();if(page==='ai')renderChat();}
    function bindPage(page){if(page==='editor')bindEditor();if(page==='github')bindGithub();if(page==='tools')bindTools();if(page==='shell')bindShell();if(page==='browser')bindBrowser();if(page==='ai')bindAi();if(page==='vpn')$('vpnProviderInfo')?.addEventListener('click',()=>toast('يتطلب VPN حقيقيًا: مزود خوادم، Android VpnService، ومفاتيح وبيانات تهيئة.'));if(page==='files')bindFiles();if(page==='settings')bindSettings();if(page==='developer')$('contactDeveloper')?.addEventListener('click',()=>openInternalBrowser('https://t.me/ro_gy'));}
    function bindEditor(){const ta=$('codeEditor');if(!ta)return;ta.addEventListener('input',()=>{save('lastCode',ta.value);updateEditorStatus()});ta.addEventListener('keyup',updateCursor);ta.addEventListener('click',updateCursor);$('openCodeFile').addEventListener('click',()=>openPicker('codeFileInput'));$('codeFileInput').addEventListener('change',readSelectedCodeFile);$('saveCode').addEventListener('click',()=>{const name=$('editorFileName').textContent||'untitled.txt';if(window.AndroidBridge)AndroidBridge.saveText(name,languageMime(),ta.value);else downloadText(name,ta.value,languageMime())});$('copyCode').addEventListener('click',()=>copyText(ta.value));$('inspectCode').addEventListener('click',inspectCode);$('runCode').addEventListener('click',runCodeSandbox);$('codeLanguage').addEventListener('change',()=>{const ext={javascript:'js',json:'json',python:'py',html:'html',css:'css',text:'txt'}[$('codeLanguage').value]||'txt';if($('editorFileName').textContent==='untitled.js')$('editorFileName').textContent='untitled.'+ext;});}
    function updateEditorStatus(){const ta=$('codeEditor');if(!ta)return;const val=ta.value;$('charCount').textContent=val.length+' characters · '+val.split('\n').length+' lines';updateCursor()}
    function updateCursor(){const ta=$('codeEditor');if(!ta)return;const pos=ta.selectionStart;const pre=ta.value.slice(0,pos).split('\n');$('cursorInfo').textContent=`Ln ${pre.length} · Col ${pre[pre.length-1].length+1}`}
    function languageMime(){const v=$('codeLanguage')?.value||'text';return ({javascript:'text/javascript',json:'application/json',python:'text/x-python',html:'text/html',css:'text/css',text:'text/plain'})[v]||'text/plain'}
    function openPicker(id){const inp=$(id);if(inp)inp.click()}
    function readSelectedCodeFile(e){const f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){toast('حجم الملف أكبر من 5 MB في قارئ النصوص الأولي.');e.target.value='';return}const r=new FileReader();r.onload=()=>{const ta=$('codeEditor');ta.value=String(r.result||'');$('editorFileName').textContent=f.name;const ext=f.name.split('.').pop().toLowerCase();const lang={js:'javascript',mjs:'javascript',cjs:'javascript',json:'json',py:'python',html:'html',htm:'html',css:'css'}[ext]||'text';$('codeLanguage').value=lang;save('lastCode',ta.value);updateEditorStatus();$('editorOutput').className='editor-output success';$('editorOutput').textContent=`Loaded ${f.name} (${f.size} bytes)`;};r.onerror=()=>toast('تعذرت قراءة الملف.');r.readAsText(f);e.target.value=''}
    function inspectCode(){const code=$('codeEditor').value;const out=[];let stack=[],state='code',quote='',escape=false,line=1;const pairs={')':'(',']':'[','}':'{'};for(let i=0;i<code.length;i++){const c=code[i],n=code[i+1];if(c==='\n')line++;if(state==='linecomment'){if(c==='\n')state='code';continue}if(state==='blockcomment'){if(c==='*'&&n==='/'){state='code';i++}continue}if(state==='string'){if(escape){escape=false;continue}if(c==='\\'){escape=true;continue}if(c===quote)state='code';continue}if(c==='/'&&n==='/'){state='linecomment';i++;continue}if(c==='/'&&n==='*'){state='blockcomment';i++;continue}if(c==='"'||c==="'"||c==='`'){state='string';quote=c;continue}if('([{'.includes(c))stack.push({c,line});else if(')]}'.includes(c)){const top=stack.pop();if(!top||top.c!==pairs[c])out.push(`Line ${line}: mismatched closing bracket '${c}'`);}}
      stack.forEach(x=>out.push(`Line ${x.line}: unclosed '${x.c}'`));if(state==='blockcomment')out.push('Unclosed block comment.');if(/\beval\s*\(/.test(code))out.push('Review: eval() increases injection risk in many contexts.');if(/innerHTML\s*=/.test(code))out.push('Review: check that data written to innerHTML is safely sanitized.');if(/(api[_-]?key|secret|password)\s*[:=]\s*["'][^"']{8,}["']/i.test(code))out.push('Warning: possible hard-coded secret or credential.');if(/\bTODO\b|\bFIXME\b/.test(code))out.push('Info: TODO/FIXME marker found.');if(!out.length)out.push('No issues found by the basic checks. This is not a full parser or security audit.');const el=$('editorOutput');el.className='editor-output '+(out.some(x=>x.includes('Warning')||x.includes('mismatched')||x.includes('unclosed'))?'error':'success');el.textContent=out.join('\n');}
    function runCodeSandbox(){
      const code=$('codeEditor').value;
      const frame=document.createElement('iframe');
      frame.sandbox='allow-scripts';frame.style.display='none';frame.title='isolated JavaScript preview';
      const escaped=code.replace(/<\/script/gi,'<\\/script');
      const childStart='<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; connect-src \'none\'; img-src data:; form-action \'none\';"><scr'+'ipt>';
      const childEnd='</scr'+'ipt>';
      const childCode=`window.onerror=function(m,s,l){parent.postMessage({afRun:true,type:'error',data:String(m)+' (line '+l+')'},'*')};
        const send=(type,args)=>parent.postMessage({afRun:true,type,data:args.map(x=>{try{return typeof x==='string'?x:JSON.stringify(x)}catch(_){return String(x)}}).join(' ')},'*');
        console.log=(...a)=>send('log',a);console.warn=(...a)=>send('warn',a);console.error=(...a)=>send('error',a);
        try{\n${escaped}\n}catch(e){send('error',[e&&e.stack||e])}`;
      frame.srcdoc=childStart+childCode+childEnd;
      const old=$('editorOutput');old.className='editor-output';old.textContent='Running JavaScript in an isolated sandbox…';
      const handler=e=>{if(e.source!==frame.contentWindow||!e.data||!e.data.afRun)return;old.className='editor-output '+(e.data.type==='error'?'error':'success');old.textContent=(e.data.type==='error'?'ERROR: ':e.data.type==='warn'?'WARN: ':'')+e.data.data;window.removeEventListener('message',handler);setTimeout(()=>frame.remove(),500)};
      window.addEventListener('message',handler);document.body.appendChild(frame);
      setTimeout(()=>{if(frame.isConnected){old.textContent+='\nNo output received (check for syntax errors).';setTimeout(()=>frame.remove(),2000);window.removeEventListener('message',handler)}},1500)
    }
    async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('تم النسخ إلى الحافظة.')}else if(window.AndroidBridge){AndroidBridge.copyText(String(text));toast('تم النسخ إلى الحافظة.')}else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('تم النسخ إلى الحافظة.')}}catch(e){toast('تعذر النسخ.')}}
    function downloadText(name,contents,mime='text/plain'){const blob=new Blob([contents],{type:mime+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    async function apiGet(url){if(!navigator.onLine)throw new Error('لا يوجد اتصال بالإنترنت.');const r=await fetch(url,{headers:{'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});if(!r.ok){let msg=`HTTP ${r.status}`;try{const b=await r.json();if(b.message)msg=b.message}catch(_){};if(r.status===403||r.status===429)msg='تم بلوغ حد الطلبات المسموح به من GitHub API؛ حاول لاحقًا أو استخدم تسجيل دخول آمن في إصدار لاحق.';throw new Error(msg)}return r.json()}
    function repoCard(r){const language=r.language||'متعدد اللغات';return `<article class="repo-card" data-repo="${escapeHtml(r.full_name)}"><div class="repo-top"><div class="repo-avatar">${icon('github',19)}</div><div style="min-width:0;flex:1"><div class="repo-title">${escapeHtml(r.full_name)}</div><p class="repo-description">${escapeHtml(r.description||'لا توجد نبذة لهذا المستودع.')}</p></div>${icon('chevron',15)}</div><div class="repo-meta"><span>${icon('star',13)} ${fmtNum(r.stargazers_count)} stars</span><span>${icon('git-branch',13)} ${escapeHtml(language)}</span><span>${icon('refresh',13)} ${escapeHtml((r.updated_at||'').slice(0,10))}</span></div></article>`}
    async function loadFeaturedRepos(){const el=$('githubResults');if(!el)return;el.innerHTML='<div class="empty-state">جارٍ الاتصال بـ GitHub API…</div>';const names=['facebook/react','microsoft/vscode','termux/termux-app'];const results=await Promise.allSettled(names.map(n=>apiGet('https://api.github.com/repos/'+n)));if(!$('githubResults'))return;const repos=results.filter(x=>x.status==='fulfilled').map(x=>x.value);const errors=results.filter(x=>x.status==='rejected');if(!repos.length){const message=errors[0]?.reason?.message||'تعذر الوصول إلى GitHub API.';el.innerHTML=`<div class="error-box">تعذر الاتصال بـ GitHub API: ${escapeHtml(message)}. تحقق من الإنترنت وحاول مرة أخرى.</div><button class="btn btn-secondary btn-sm" id="retryGitHub" style="margin-top:10px">إعادة المحاولة</button>`;$('retryGitHub')?.addEventListener('click',loadFeaturedRepos);return}el.innerHTML='<div class="label-inline">مستودعات مقترحة · بيانات مباشرة من GitHub</div>'+repos.map(repoCard).join('')+(errors.length?'<div class="field-hint">تعذر تحميل بعض المستودعات.</div>':'')}
    function bindGithub(){$('searchRepos').addEventListener('click',searchRepos);$('repoSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchRepos()}});$('openGithubWeb').addEventListener('click',()=>openInternalBrowser('https://github.com'));$('githubResults').addEventListener('click',e=>{const c=e.target.closest('[data-repo]');if(c){const [owner,repo]=c.dataset.repo.split('/');openRepo(owner,repo)}})}
    async function searchRepos(){const q=$('repoSearch').value.trim();if(q.length<2){toast('اكتب حرفين على الأقل للبحث.');return}const el=$('githubResults');el.innerHTML=`<div class="empty-state">${icon('search',20)}<br>جارٍ البحث…</div>`;try{const data=await apiGet('https://api.github.com/search/repositories?q='+encodeURIComponent(q)+'&sort=stars&order=desc&per_page=20');el.innerHTML=data.items.length?`<div class="label-inline">${data.total_count.toLocaleString()} نتيجة تقريبًا · يعرض أول ${data.items.length}</div>`+data.items.map(repoCard).join(''):'<div class="empty-state">لا توجد نتائج.</div>'}catch(e){el.innerHTML=`<div class="error-box">${escapeHtml(e.message)}</div>`}}
    async function openRepo(owner,repo){selectedRepo={owner,repo};githubPath='';const detail=$('githubDetail');if(!detail)return;detail.innerHTML='<div class="panel"><div class="empty-state">جارٍ تحميل الملفات…</div></div>';try{const r=await apiGet(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`);githubBranch=r.default_branch||'main';const treeData=await apiGet(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(githubBranch)}?recursive=1`);githubTree=treeData.tree||[];renderRepoDetail(r,githubTree,'')}catch(e){detail.innerHTML=`<div class="error-box">تعذر فتح المستودع: ${escapeHtml(e.message)}</div>`}}
    function renderRepoDetail(repo,tree,path){githubPath=path;const detail=$('githubDetail');if(!detail)return;const prefix=path?path+'/':'';const entries=new Map();tree.filter(x=>x.path.startsWith(prefix)&&x.path!==prefix).forEach(x=>{const rest=x.path.slice(prefix.length);if(!rest)return;const parts=rest.split('/');if(parts.length>1){if(!entries.has(parts[0]))entries.set(parts[0],{name:parts[0],type:'tree',path:prefix+parts[0]})}else if(!entries.has(rest))entries.set(rest,{name:rest,type:x.type==='tree'?'tree':'blob',path:x.path,size:x.size})});const rows=[...entries.values()].sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='tree'?-1:1).slice(0,300);detail.innerHTML=`<div class="panel"><div class="panel-head"><div class="panel-title icon-inline">${icon('folder',16)} <span class="mono-dir">${escapeHtml(repo.full_name)}</span></div><button class="btn btn-secondary btn-sm" id="openRepoWebsite">${icon('external',13)} عرض الموقع</button></div><div class="panel-body"><p class="page-description" style="margin-bottom:10px">${escapeHtml(repo.description||'لا توجد نبذة للمستودع.')} · branch: <span class="mono-dir">${escapeHtml(githubBranch)}</span></p><div class="toolbar" style="margin-bottom:10px"><button class="btn btn-ghost btn-sm" id="repoRoot">${icon('folder',13)} الجذر</button>${path?`<span class="label-inline mono-dir">/${escapeHtml(path)}</span>`:''}<span class="status-pill">${rows.length} عناصر</span></div><div id="repoTreeList">${rows.map(x=>`<div class="file-row" data-git-kind="${x.type}" data-git-path="${escapeHtml(x.path)}"><span class="file-icon">${icon(x.type==='tree'?'folder':'file',15)}</span><span class="file-path">${escapeHtml(x.name)}</span>${x.type==='blob'?`<span class="label-inline">${x.size?fmtNum(x.size)+' B':''}</span>`:''}${icon('chevron',13)}</div>`).join('')||'<div class="empty-state">لا توجد عناصر في هذا المسار.</div>'}</div><div id="repoFileView"></div></div></div>`;$('openRepoWebsite').addEventListener('click',()=>openInternalBrowser(repo.html_url));$('repoRoot').addEventListener('click',()=>renderRepoDetail(repo,tree,''));$('repoTreeList').addEventListener('click',e=>{const row=e.target.closest('[data-git-path]');if(!row)return;const p=row.dataset.gitPath;if(row.dataset.gitKind==='tree')renderRepoDetail(repo,tree,p);else openRepoFile(ownerFrom(repo.full_name),repoNameFrom(repo.full_name),p)});}
    const ownerFrom=(n)=>n.split('/')[0],repoNameFrom=(n)=>n.split('/')[1];
    async function openRepoFile(owner,repo,path){const box=$('repoFileView');if(!box)return;box.innerHTML='<div class="empty-state">جارٍ تحميل الملف…</div>';try{const f=await apiGet(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(githubBranch)}`);let textContent='';if(f.type!=='file'||f.encoding!=='base64')throw new Error('هذا الملف غير متاح كملف نصي للمعاينة.');textContent=decodeBase64Utf8(f.content.replace(/\s/g,''));box.innerHTML=`<div class="divider"></div><div class="toolbar" style="justify-content:space-between;margin-bottom:9px"><strong class="mono-dir" style="font-size:11px">${escapeHtml(path)}</strong><div class="toolbar"><button class="btn btn-secondary btn-sm" id="copyRepoFile">${icon('copy',13)} نسخ</button><button class="btn btn-primary btn-sm" id="editRepoFile">${icon('code',13)} فتح بالمحرر</button></div></div><pre class="source-pre" id="githubSource"></pre>`;$('githubSource').textContent=textContent;$('copyRepoFile').addEventListener('click',()=>copyText(textContent));$('editRepoFile').addEventListener('click',()=>{save('lastCode',textContent);navTo('editor');setTimeout(()=>{if($('codeEditor')){$('codeEditor').value=textContent;$('editorFileName').textContent=path.split('/').pop();const ext=path.split('.').pop().toLowerCase();$('codeLanguage').value=({js:'javascript',json:'json',py:'python',html:'html',css:'css'}[ext]||'text');updateEditorStatus()}},0)})}catch(e){box.innerHTML=`<div class="error-box">تعذر معاينة الملف: ${escapeHtml(e.message)}</div>`}}
    function decodeBase64Utf8(s){const binary=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder('utf-8',{fatal:false}).decode(bytes)}
    function bindTools(){$('utilityWorkbench').addEventListener('click',e=>{const u=e.target.closest('[data-utility]');if(u){$('utilityWorkbench').innerHTML=utilityWorkbench(u.dataset.utility);bindUtility();return}});bindUtility()}
    function bindUtility(){const run=$('runUtility');if(run)run.addEventListener('click',()=>processUtility(currentUtility,false));$('base64Encode')?.addEventListener('click',()=>processUtility('base64','encode'));$('base64Decode')?.addEventListener('click',()=>processUtility('base64','decode'));$('urlEncode')?.addEventListener('click',()=>processUtility('url','encode'));$('urlDecode')?.addEventListener('click',()=>processUtility('url','decode'));$('decryptUtility')?.addEventListener('click',()=>processUtility('crypto','decrypt'));$('copyUtilityOutput')?.addEventListener('click',()=>copyText($('utilityOutput').textContent));$('clearUtility')?.addEventListener('click',()=>{$('utilityInput').value='';$('utilityOutput').textContent='ستظهر النتيجة هنا…';if($('cryptoPassword'))$('cryptoPassword').value='';});}
    function utf8ToBase64(s){const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
    function base64ToUtf8(s){return decodeBase64Utf8(s)}
    async function deriveAesKey(password,salt,usage){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,usage)}
    async function processUtility(type,action){const inp=$('utilityInput')?.value??'';const out=$('utilityOutput');if(!out)return;out.textContent='';try{let result='';switch(type){case'json':result=JSON.stringify(JSON.parse(inp),null,2);break;case'base64':result=action==='decode'?base64ToUtf8(inp.trim()):utf8ToBase64(inp);break;case'url':result=action==='decode'?decodeURIComponent(inp):encodeURIComponent(inp);break;case'hash':{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(inp));result=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');break}case'regex':{const pattern=$('regexPattern').value;const flags=$('regexFlags').value;if(flags.split('').some((x,i)=>flags.indexOf(x)!==i)||/[^dgimsuvy]/.test(flags))throw new Error('خيارات Regex غير صالحة.');const effectiveFlags=flags.includes('g')?flags:flags+'g';const re=new RegExp(pattern,effectiveFlags);const matches=Array.from(inp.matchAll(re));result=JSON.stringify({matches:matches.length,results:matches.slice(0,100).map(m=>({match:m[0],index:m.index}))},null,2);break}case'crypto':{const pass=$('cryptoPassword').value;if(pass.length<8)throw new Error('استخدم عبارة مرور من 8 أحرف على الأقل.');if(action==='decrypt'){const envelope=JSON.parse(inp);const salt=Uint8Array.from(atob(envelope.salt),c=>c.charCodeAt(0)),iv=Uint8Array.from(atob(envelope.iv),c=>c.charCodeAt(0)),data=Uint8Array.from(atob(envelope.data),c=>c.charCodeAt(0));const key=await deriveAesKey(pass,salt,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);result=new TextDecoder().decode(plain)}else{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveAesKey(pass,salt,['encrypt']);const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(inp));const b64=a=>{let b='';new Uint8Array(a).forEach(x=>b+=String.fromCharCode(x));return btoa(b)};result=JSON.stringify({version:1,algorithm:'AES-256-GCM',kdf:'PBKDF2-SHA256-150000',salt:b64(salt),iv:b64(iv),data:b64(data)},null,2)}break}default:result=inp}out.textContent=result;toast('تمت العملية بنجاح.')}catch(e){out.textContent='ERROR: '+(e.message||String(e));toast('تعذرت العملية؛ تحقق من المدخلات.')}}
    function bindShell(){$('openTermux').addEventListener('click',()=>{if(window.AndroidBridge)AndroidBridge.openTermux();else openInternalBrowser('https://github.com/termux/termux-app')});$('sendTermuxCommand').addEventListener('click',()=>{const c=$('termuxCommand').value.trim();if(!c){toast('اكتب الأمر أولًا.');return}if(window.AndroidBridge)AndroidBridge.runTermuxCommand(c);else toast('تشغيل الأوامر يتطلب نسخة أندرويد الأصلية مع Termux.');});document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>{$('termuxCommand').value=b.dataset.command;$('termuxCommand').focus()}))}
    function openInternalBrowser(url){const target=safeUrl(url);if(!target){toast('عنوان الموقع غير صالح.');return}if(window.AndroidBridge){AndroidBridge.openBrowser(target)}else{window.open(target,'_blank','noopener,noreferrer')}}
    function safeUrl(value){let raw=String(value||'').trim();if(!raw)return null;if(!/^https?:\/\//i.test(raw)){if(raw.includes(' ')||!raw.includes('.'))raw='https://www.google.com/search?q='+encodeURIComponent(raw);else raw='https://'+raw}try{const u=new URL(raw);if(!['http:','https:'].includes(u.protocol))return null;if(u.protocol==='http:')u.protocol='https:';return u.href}catch(_){return null}}
    function bindBrowser(){$('browserForm').addEventListener('submit',e=>{e.preventDefault();const target=safeUrl($('browserAddress').value);if(!target){toast('أدخل عنوانًا صالحًا.');return}openInternalBrowser(target)});document.querySelectorAll('[data-browser-url]').forEach(b=>b.addEventListener('click',()=>openInternalBrowser(b.dataset.browserUrl)))}
    function renderChat(){const box=$('chatMessages');if(!box)return;box.innerHTML=aiMessages.map(m=>`<div class="chat-bubble ${m.role==='user'?'user':'ai'}">${escapeHtml(m.content)}</div>`).join('')||'<div class="chat-bubble ai">مرحبًا، أدخل عنوان API متوافقًا واسم النموذج ومفتاحك المؤقت، ثم أرسل سؤالًا.</div>';box.scrollTop=box.scrollHeight}
    function bindAi(){const key=$('aiKey');key.value=aiSessionKey;$('saveAiConfig').addEventListener('click',()=>{aiSessionKey=key.value.trim();save('aiEndpoint',$('aiEndpoint').value.trim());save('aiModel',$('aiModel').value.trim());$('aiStatus').textContent=aiSessionKey&&$('aiModel').value.trim()?'تم الإعداد':'ناقص الإعداد';$('aiStatus').className='status-pill '+(aiSessionKey&&$('aiModel').value.trim()?'green':'amber');toast(aiSessionKey&&$('aiModel').value.trim()?'تم إعداد الاتصال لهذه الجلسة.':'أدخل مفتاح API واسم النموذج.');});$('chatForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('chatInput').value.trim();if(!q)return;const endpoint=$('aiEndpoint').value.trim().replace(/\/+$/,'');const model=$('aiModel').value.trim();if(!aiSessionKey||!model){toast('أكمل إعداد عنوان API واسم النموذج والمفتاح.');return}save('aiEndpoint',endpoint);save('aiModel',model);aiMessages.push({role:'user',content:q});$('chatInput').value='';renderChat();aiMessages.push({role:'assistant',content:'جارٍ الاتصال بالمزود…'});renderChat();try{const index=aiMessages.length-1;const response=await fetch(endpoint+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+aiSessionKey},body:JSON.stringify({model,messages:aiMessages.filter((m,i)=>i!==index).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content})),stream:false})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'HTTP '+response.status);aiMessages[index].content=data.choices?.[0]?.message?.content||'لم يُرجع المزود محتوى.';$('aiStatus').textContent='متصل';$('aiStatus').className='status-pill green'}catch(err){aiMessages[aiMessages.length-1].content='تعذر الاتصال: '+err.message+'\nتحقق من CORS وعنوان المزود والمفتاح واسم النموذج. بعض المزودين يتطلبون خادمًا وسيطًا.';$('aiStatus').textContent='خطأ اتصال';$('aiStatus').className='status-pill red'}renderChat();});}
    function bindFiles(){$('openAnyFile').addEventListener('click',()=>openPicker('fileOpenInput'));let inp=$('fileOpenInput');if(!inp){inp=document.createElement('input');inp.type='file';inp.id='fileOpenInput';inp.hidden=true;inp.accept='.txt,.md,.json,.xml,.html,.htm,.css,.js,.ts,.py,.java,.kt,.c,.cpp,.sh,.log,.csv,.yaml,.yml,.toml,.gradle,.properties';inp.addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){toast('حجم الملف أكبر من 5 MB في قارئ النصوص الأولي.');e.target.value='';return}const r=new FileReader();r.onload=()=>{const contents=String(r.result||'');save('lastCode',contents);const name=f.name;const ext=name.split('.').pop().toLowerCase();const lang={js:'javascript',mjs:'javascript',cjs:'javascript',json:'json',py:'python',html:'html',htm:'html',css:'css'}[ext]||'text';navTo('editor');setTimeout(()=>{if($('codeEditor')){$('codeEditor').value=contents;$('editorFileName').textContent=name;$('codeLanguage').value=lang;updateEditorStatus();$('editorOutput').textContent='Loaded '+name+' ('+f.size+' bytes)';$('editorOutput').className='editor-output success'}},0)};r.onerror=()=>toast('تعذرت قراءة الملف.');r.readAsText(f);e.target.value=''});document.body.appendChild(inp)}$('extractZip').addEventListener('click',()=>{if(window.AndroidBridge)AndroidBridge.extractZip();else toast('استخراج ZIP يتطلب واجهة ملفات أندرويد.');})}
    function bindSettings(){document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{save('theme',b.dataset.theme);applySettings();navTo('settings')}));$('fontSizeSlider')?.addEventListener('input',e=>{save('fontSize',e.target.value);$('fontSizeValue').textContent=e.target.value;applySettings()});$('densitySelect')?.addEventListener('change',e=>{save('density',e.target.value);applySettings();toast('تم تحديث كثافة الواجهة.')});$('motionSwitch')?.addEventListener('change',e=>{save('motion',e.target.checked?'1':'0');applySettings();toast(e.target.checked?'تم تفعيل الحركة.':'تم تقليل الحركة.')});$('resetSettings')?.addEventListener('click',()=>{['theme','fontSize','density','motion','aiEndpoint','aiModel'].forEach((k)=>localStorage.removeItem('af:'+k));applySettings();navTo('settings');toast('تمت استعادة إعدادات الواجهة.')})}
    function openSearchModal(){const root=$('modalRoot');const choices=[...primary,...advanced,['developer','عن المطور']];root.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="command-modal"><div class="command-search">${icon('search',20)}<input id="commandSearchInput" placeholder="ابحث عن أداة أو قسم…" autocomplete="off"><button class="icon-btn" id="closeCommand" style="width:30px;height:30px">${icon('close',15)}</button></div><div class="command-results" id="commandResults">${choices.map(([p,l])=>`<button class="command-result" data-command-page="${p}"><span class="tool-icon">${icon(icoFor[p],18)}</span><span>${l}<small>${pages[p][1]}</small></span>${icon('chevron',13)}</button>`).join('')}</div></div></div>`;const close=()=>root.innerHTML='';$('closeCommand').addEventListener('click',close);$('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')close()});root.querySelectorAll('[data-command-page]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.commandPage;close();navTo(p)}));$('commandSearchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('commandResults').querySelectorAll('[data-command-page]').forEach(b=>{b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none'})});$('commandSearchInput').focus()}
    document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){navTo(p.dataset.page);return}const u=e.target.closest('[data-utility]');if(u){if(currentPage!=='tools'){navTo('tools');setTimeout(()=>{const w=$('utilityWorkbench');if(w){w.innerHTML=utilityWorkbench(u.dataset.utility);bindUtility()}},0)}else if(!$('utilityWorkbench')?.contains(u)){const w=$('utilityWorkbench');if(w){w.innerHTML=utilityWorkbench(u.dataset.utility);bindUtility();w.scrollIntoView({behavior:stored('motion','1')==='1'?'smooth':'auto',block:'start'})}}}});
    $('globalSearch').addEventListener('click',openSearchModal);$('homeButton').addEventListener('click',()=>navTo('home'));window.addEventListener('online',setOnline);window.addEventListener('offline',setOnline);
    initializeNav();applySettings();setOnline();navTo('home');
  })();
